[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fatigue-detect"
version = "0.1.0"
description = "驾驶员疲劳检测系统 - 基于 YOLOv8 + ONNX + PyQt5"
readme = "README.md"
license = { text = "GPL-3.0" }
requires-python = ">=3.8"
dependencies = [
    "PyQt5>=5.15.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "mediapipe>=0.10.0",
    "onnxruntime-gpu>=1.20.0",
]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
